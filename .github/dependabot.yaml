version: 2

updates:
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'daily'
      labels:
          - 'dependencies'
      commit-message:
          prefix: 'build(deps)'
      ignore:
          - dependency-name: '*'
            update-types:
                - 'version-update:semver-major'
      groups:
          github-actions:
              patterns:
                  - '*'
              update-types:
                  - 'minor'
                  - 'patch'

    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'daily'
      labels:
          - 'dependencies'
      commit-message:
          prefix: 'build(deps)'
      ignore:
          - dependency-name: '*'
            update-types:
                - 'version-update:semver-major'
      groups:
          npm:
              patterns:
                  - '*'
              update-types:
                  - 'minor'
                  - 'patch'
