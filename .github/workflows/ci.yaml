name: CI

on:
    push:
        branches:
            - main
    pull_request:
        types:
            - opened
            - synchronize
            - reopened

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    ci:
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout repository
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

            - name: Set up Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
              with:
                  cache: npm
                  node-version-file: .nvmrc

            - name: Install dependencies
              run: npm ci --no-audit --no-fund

            - name: Lint
              run: npm run lint:ox

            - name: Format
              run: npm run format:ox:check

            - name: Typecheck
              run: |
                  npm run typecheck:next
                  npm run typecheck

            - name: Knip
              run: npm run knip

            - name: Build
              run: npm run build
              env:
                  NEXT_PUBLIC_SITE_URL: http://localhost:3000
                  BETTER_AUTH_URL: http://localhost:3000
                  BETTER_AUTH_SECRET: ci-only-placeholder-secret-at-least-32-chars
                  DATABASE_URL: postgres://postgres:postgres@react-template-db-not-configured.invalid:5432/app
