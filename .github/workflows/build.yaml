name: Build

on:
    push:
        branches:
            - main
    pull_request:
        types:
            - opened
            - synchronize
            - reopened

concurrency:
    group: build-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build:
        if: ${{ github.actor != 'dependabot[bot]' }}
        runs-on: ubuntu-latest
        timeout-minutes: 15

        env:
            # Compile-only placeholders — this job never starts a database or sends real email, it
            # only needs `next build` to succeed. NEXT_PUBLIC_SITE_URL is inlined into the client
            # bundle and is never sensitive, so it doesn't need to be a secret here — deployment
            # (not yet configured) would supply its own real value independently of this job.
            # The `.invalid` hostname (RFC 2606) can never resolve to any real service, including
            # another project's database on this host.
            NEXT_PUBLIC_SITE_URL: http://localhost:3000
            BETTER_AUTH_URL: http://localhost:3000
            BETTER_AUTH_SECRET: ci-only-placeholder-secret-at-least-32-chars
            DATABASE_URL: postgres://postgres:postgres@react-template-db-not-configured.invalid:5432/app

        steps:
            - name: Checkout repository
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

            - name: Set up Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
              with:
                  cache: npm
                  node-version-file: .nvmrc

            - name: Set up npm
              run: npm install --global npm@12.0.2

            - name: Install dependencies
              run: npm ci --no-audit --no-fund

            - name: Build
              run: npm run build
