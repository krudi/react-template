name: Build

on:
    push:
        branches:
            - main
    pull_request:
        types:
            - opened
            - synchronize
            - reopened

concurrency:
    group: build-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        env:
            NEXT_PUBLIC_SITE_URL: http://localhost:3000
            BETTER_AUTH_URL: http://localhost:3000
            BETTER_AUTH_SECRET: ci-only-placeholder-secret-at-least-32-chars
            DATABASE_URL: postgres://postgres:postgres@react-template-db-not-configured.invalid:5432/app

        steps:
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

            - name: Set up Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
              with:
                  cache: npm
                  node-version-file: .nvmrc

            - name: Set up npm
              run: npm install --global "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"

            - name: Install dependencies
              run: npm ci --no-audit --no-fund

            - name: Build
              run: npm run build
