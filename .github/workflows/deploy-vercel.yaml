name: Deploy (Vercel)

on:
    release:
        types: [published]

concurrency:
    group: deploy-vercel
    cancel-in-progress: false

permissions:
    contents: read

env:
    VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
    VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    VERCEL_CLI_VERSION: 65.11.0

jobs:
    deploy:
        name: Deploy to production
        runs-on: ubuntu-latest
        timeout-minutes: 20
        environment:
            name: production
            url: ${{ steps.deploy.outputs.url }}

        steps:
            - name: Checkout release
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
              with:
                  ref: ${{ github.event.release.tag_name }}
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
              with:
                  cache: npm
                  node-version-file: .nvmrc

            - name: Set up npm and the Vercel CLI
              run: |
                  npm install --global "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
                  npm install --global "vercel@${VERCEL_CLI_VERSION}"

            - name: Install dependencies
              run: npm ci --no-audit --no-fund

            - name: Pull production settings
              run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

            - name: Build
              run: vercel build --prod --token="$VERCEL_TOKEN"

            - name: Deploy
              id: deploy
              env:
                  VERSION: ${{ github.event.release.tag_name }}
              run: |
                  url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" \
                    --meta release="$VERSION" --meta commit="$GITHUB_SHA")"
                  echo "url=$url" >> "$GITHUB_OUTPUT"
                  echo "Deployed $VERSION to production ($url)." >> "$GITHUB_STEP_SUMMARY"
