changelog:
    exclude:
        labels:
            - 'skip changelog'
    categories:
        - title: 'Breaking changes'
          labels:
              - 'breaking change'
        - title: 'Features'
          labels:
              - 'feature'
              - 'enhancement'
        - title: 'Fixes'
          labels:
              - 'bug'
        - title: 'Dependencies'
          labels:
              - 'dependencies'
        - title: 'Other changes'
          labels:
              - '*'
