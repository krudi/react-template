name: Set up Node workspace
description: Configure the repository Node and npm versions and install the locked workspace dependencies.

runs:
    using: composite
    steps:
        - name: Set up Node.js
          uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
          with:
              cache: npm
              node-version-file: .nvmrc

        - name: Pin npm to the version in package.json
          shell: bash
          run: |
              PINNED="$(node -p "(require('./package.json').packageManager || '').split('@')[1] || ''")"
              if [ -n "$PINNED" ] && [ "$(npm -v)" != "$PINNED" ]; then
                npm install -g "npm@${PINNED}"
              fi
              npm -v

        - name: Install npm dependencies
          shell: bash
          run: npm ci --no-audit --no-fund
